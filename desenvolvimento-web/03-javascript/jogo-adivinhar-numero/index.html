<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhar o Número</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <h1>Jogo de Adivinhar o Número</h1>
        <p>Escolhi um número entre 1 e 100. Tente descobrir!</p>

        <input type="text" id="palpite" placeholder="Digite seu palpite">
        <button onclick="verificarPalpite()">Verificar</button>
        <p id="mensagem">Boa sorte!</p>
        <button onclick="novoJogo()">Novo Jogo</button>
    </main>
</body>
</html>
