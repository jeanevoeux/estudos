<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Frases</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Consulta de Frases</h1>

        </div>
        <button id="botao">Buscar frase</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
